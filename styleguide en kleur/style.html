<style>
p {
    font-family: cursive;
    font-size: 3em;
    font-weight: 900;
}


p:nth-of-type(1) {
    color: rgb(255 200 0);
}

p:nth-of-type(2) {
    color: hsl(45 100 50 / 100%);
}


p:nth-of-type(3) {
    color: #ffd700;
}

button {
    font-size: 3em;
    padding: 1em;
    border-style: none;
    border-radius: 10em;

    --h: 45;
    --s: 100%;
    --l: 50%;
    --a: 1;
    
    background: hsl(var(--h) var(--s) var(--l) / var(--a));

    &:hover {
        --l: 75%; /*change lightness*/
    }
    &:focus, &:active {
        --s: 100%; /* change saturation */
    }
    &[disabled] { /*make look disabled*/
        --s:0%;
        --a: 0.5;
    }
}

</style>
