<style>

body {
    justify-content: center;
}

p {
    font-size: 10em;
    font-family: arial;
    line-height: 1.4em;

    justify-self: center;

    animation-duration: 1s;
    animation-name: animation;
    animation-iteration-count: infinite;
}

@keyframes animation {
  0% {
    font-weight: 100;
  }

  50% {
    font-weight: 900;
    letter-spacing: 0.25em;
    text-decoration: line-through;
  }

  100% {
    font-weight: 100;
  }
}

</style>
